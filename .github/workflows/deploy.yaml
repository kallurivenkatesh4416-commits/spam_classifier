name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for secret_name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub secret::$secret_name is not set. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="$HOME/spam_classifier"
            REPO_URL="https://github.com/kallurivenkatesh4416-commits/spam_classifier.git"

            if ! command -v git >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y git docker.io
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y git docker
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y git docker
              else
                echo "Could not find a supported package manager to install git and docker."
                exit 1
              fi
            fi

            sudo systemctl enable docker
            sudo systemctl start docker

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            sudo docker stop spam-classifier || true
            sudo docker rm spam-classifier || true
            sudo docker build -t spam-classifier .
            sudo docker run -d --name spam-classifier -p 8501:8501 --restart unless-stopped spam-classifier
