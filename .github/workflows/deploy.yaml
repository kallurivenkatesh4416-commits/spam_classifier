name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/spam_classifier
            git pull origin main
            docker stop spam-classifier || true
            docker rm spam-classifier || true
            docker build -t spam-classifier .
            docker run -d --name spam-classifier -p 8501:8501 --restart unless-stopped spam-classifier
